<!DOCTYPE html>
<html>
<head>
    <title>ID Card Management System</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            background:#f4f6f9;
        }

        .container{
            text-align:center;
            margin-top:120px;
        }

        h1{
            color:#1e3a8a;
            margin-bottom:15px;
        }

        p{
            color:#666;
            margin-bottom:40px;
        }

        .btn{
            display:inline-block;
            width:250px;
            margin:15px;
            padding:18px;
            background:#1e3a8a;
            color:white;
            text-decoration:none;
            border-radius:10px;
            font-size:18px;
            transition:.3s;
        }

        .btn:hover{
            background:#162d6b;
        }

    </style>

</head>
<body>

<div class="container">

    <h1>ID Card Management System</h1>

    <p>
        Student & Employee Identification Card Generator
    </p>

    <a href="/profiles/create" class="btn">
        Create Profile
    </a>

    <a href="/profiles" class="btn">
        View Profiles
    </a>

</div>

</body>
</html>
