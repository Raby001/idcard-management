<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Profiles</title>

    <style>

        body{
            font-family:Arial,sans-serif;
            background:#f4f6f9;
            margin:0;
        }

        .navbar{
            background:#1e3a8a;
            padding:15px;
        }

        .navbar a{
            color:white;
            text-decoration:none;
            margin-right:20px;
        }

        .container{
            padding:30px;
        }

        table{
            width:100%;
            border-collapse:collapse;
            background:white;
        }

        th{
            background:#1e3a8a;
            color:white;
            padding:12px;
        }

        td{
            padding:12px;
            border-bottom:1px solid #ddd;
        }

        .btn{
            padding:6px 12px;
            color:white;
            text-decoration:none;
            border-radius:5px;
        }

        .view{
            background:#198754;
        }

        .delete{
            background:#dc3545;
        }

    </style>

</head>

<body>

<div class="navbar">
    <a href="/">Home</a>
    <a href="/profiles/create">Create Profile</a>
</div>

<div class="container">

    <h2>Profile List</h2>

    <table>

        <thead>

        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Type</th>
            <th>Registration</th>
            <th>Actions</th>
        </tr>

        </thead>

        <tbody>

        <tr th:each="profile : ${profiles}">

            <td th:text="${profile.id}"></td>

            <td th:text="${profile.fullName}"></td>

            <td th:text="${profile.type}"></td>

            <td th:text="${profile.registrationNumber}"></td>
            <td>

                <a
                        class="btn view"
                        th:href="@{'/profiles/view/' + ${profile.id}}">
                    View
                </a>

                <a
                        class="btn delete"
                        th:href="@{'/profiles/delete/' + ${profile.id}}">
                    Delete
                </a>

                <a
                        class="btn view"
                        th:href="@{'/export/pdf/' + ${profile.id}}">
                    PDF
                </a>
                
                <a href="/export/batch"
                  class="btn">
                    Batch Export
                </a>
            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
